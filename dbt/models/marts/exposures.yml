version: 2

# Une exposure declare ce qui consomme les marts. Elle apparait dans le lineage, donc un relecteur voit
# d'un coup d'oeil quels modeles un ecran casse s'il est modifie.
#
# Le tableau de bord Power BI du module 3 est declare en dernier. Les deux premieres exposures
# sont celles du module 2 : les deux ecrans de l'ERP et les
# bordereaux envoyes aux apporteurs.

exposures:
  - name: ecran_anomalies_erp
    label: Ecran des anomalies de rapprochement
    type: application
    maturity: high
    url: http://localhost:8000/anomalies
    description: >
      Ecran de gestion de l'ERP. Il affiche les lots rejetes, les ecarts de rapprochement et les
      mouvements bancaires qu'aucun appel ne reclame.
    depends_on:
      - ref('mart_anomalies_rapprochement')
      - ref('mart_mouvements_non_rapproches')
      - ref('mart_qualite_des_lots')
    owner:
      name: Cabinet Grossiste Occitanie
      email: gestion@exemple.invalid

  - name: bordereaux_apporteurs
    label: Bordereaux mensuels de retrocession
    type: analysis
    maturity: high
    description: >
      Bordereau mensuel envoye a chaque apporteur, produit en base et en CSV par la chaine Airflow.
    depends_on:
      - ref('mart_bordereau_retrocessions_apporteur')
      - ref('fct_commissions')
    owner:
      name: Cabinet Grossiste Occitanie
      email: gestion@exemple.invalid

  - name: tableau_de_bord_pilotage
    label: Tableau de bord de pilotage (Power BI)
    type: dashboard
    maturity: medium
    url: https://github.com/yzasmin/courtage-erp/tree/master/powerbi
    description: >
      Projet Power BI au format PBIP (modele semantique TMDL). Il lit les marts en etoile et porte les
      quatre indicateurs de docs/kpi.md : ratio sinistres sur primes, taux de resiliation, production par
      apporteur, portefeuille par branche.
    depends_on:
      - ref('fct_cotisations_acquises')
      - ref('fct_prestations')
      - ref('fct_mouvements_portefeuille')
      - ref('fct_portefeuille_mensuel')
      - ref('fct_cotisations')
      - ref('dim_date')
      - ref('dim_produit')
      - ref('dim_branche')
      - ref('dim_compagnie')
      - ref('dim_apporteur')
      - ref('dim_adherent')
    owner:
      name: Cabinet Grossiste Occitanie
      email: gestion@exemple.invalid
